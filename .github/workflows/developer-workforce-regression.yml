name: Developer Workforce Full Regression
on:
  pull_request:
    paths:
      - "hehggadaopoacecdllhhajmbjkdcmajg/**"
      - ".github/workflows/developer-workforce-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('hehggadaopoacecdllhhajmbjkdcmajg/1.26.901.11451_0/manifest.json','utf8')); console.log('manifest PASS')"
      - name: Package and static reference integrity
        run: node hehggadaopoacecdllhhajmbjkdcmajg/1.26.901.11451_0/tests/package-integrity.test.js
      - name: Runtime observability
        run: node hehggadaopoacecdllhhajmbjkdcmajg/1.26.901.11451_0/tests/titan-runtime-observability.test.js
      - name: WP1 profiles
        run: node hehggadaopoacecdllhhajmbjkdcmajg/1.26.901.11451_0/codex-sidepanel/tests/titan-agent-profiles.test.js
      - name: WP2 scheduler
        run: node hehggadaopoacecdllhhajmbjkdcmajg/1.26.901.11451_0/titan-workforce/chat-five-pass-scheduler.test.js
      - name: WP2 integration
        run: node hehggadaopoacecdllhhajmbjkdcmajg/1.26.901.11451_0/titan-workforce/chat-five-pass-integration.test.js
      - name: WP3 pipeline
        run: node hehggadaopoacecdllhhajmbjkdcmajg/1.26.901.11451_0/titan-work-codex-pipeline-selftest.js
      - name: WP4 core
        run: node hehggadaopoacecdllhhajmbjkdcmajg/1.26.901.11451_0/codex-sidepanel/titan-workforce/core-selftest.mjs
      - name: Live chat runtime handoff
        run: node hehggadaopoacecdllhhajmbjkdcmajg/1.26.901.11451_0/codex-sidepanel/titan-workforce/live-chat-runtime.test.mjs
      - name: WP4 control-state safety
        run: node hehggadaopoacecdllhhajmbjkdcmajg/1.26.901.11451_0/codex-sidepanel/titan-workforce/control-selftest.mjs
      - name: Stock native bridge and fallback services
        run: node hehggadaopoacecdllhhajmbjkdcmajg/1.26.901.11451_0/codex-sidepanel/titan-workforce/stock-service-fallbacks.test.mjs
      - name: MCP registry and WebMCP bridge
        run: node hehggadaopoacecdllhhajmbjkdcmajg/1.26.901.11451_0/codex-sidepanel/titan-workforce/mcp-registry.test.mjs
      - name: Native execution capability broker
        run: node hehggadaopoacecdllhhajmbjkdcmajg/1.26.901.11451_0/codex-sidepanel/titan-workforce/execution-capabilities.test.mjs
      - name: Scoped Codex capability enforcement
        run: node hehggadaopoacecdllhhajmbjkdcmajg/1.26.901.11451_0/codex-sidepanel/titan-workforce/scoped-codex-capability.test.mjs
      - name: Validate side-panel references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("hehggadaopoacecdllhhajmbjkdcmajg/1.26.901.11451_0/codex-sidepanel")
          html=(p/"index.html").read_text()
          missing=[]
          for src in re.findall(r'<script[^>]+src="([^"]+)"',html):
              q=(p/src).resolve()
              if not q.exists(): missing.append((src,str(q)))
          if missing: raise SystemExit("Missing script references: "+repr(missing))
          if 'titan-5x5-supervisor.js' in html: raise SystemExit("Legacy 5x5 supervisor must not be active in v4 side panel")
          if 'titan-5x5-selftest.js' in html: raise SystemExit("Legacy 5x5 self-test must not be active in v4 side panel")
          print("side-panel references PASS")
          PY
